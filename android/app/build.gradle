apply plugin: 'com.android.application'

// TikTok App Events SDK configuration.
// Values can come from android/tiktok.properties, Gradle -P properties, or CI environment variables.
// Never add TIKTOK_APP_SECRET here: an App Secret must stay server-side.
def tiktokPropertiesFile = rootProject.file("tiktok.properties")
def tiktokProperties = new Properties()
if (tiktokPropertiesFile.exists()) {
    tiktokProperties.load(new FileInputStream(tiktokPropertiesFile))
}

def resolveTikTokConfig = { String key ->
    def gradleValue = project.findProperty(key)
    if (gradleValue != null && gradleValue.toString().trim()) return gradleValue.toString().trim()
    def envValue = System.getenv(key)
    if (envValue != null && envValue.trim()) return envValue.trim()
    return tiktokProperties.getProperty(key, "").trim()
}

def escapeBuildConfigValue = { String value ->
    value.replace("\\", "\\\\").replace('"', '\\"')
}

def tiktokAppId = resolveTikTokConfig("TIKTOK_APP_ID")
def tiktokTtAppId = resolveTikTokConfig("TIKTOK_TT_APP_ID")
def tiktokAccessToken = resolveTikTokConfig("TIKTOK_ACCESS_TOKEN")


def fitmateSigningPropertiesFile = rootProject.file("fitmate-release-signing.properties")
def fitmateSigningProperties = new Properties()
if (fitmateSigningPropertiesFile.exists()) {
    fitmateSigningProperties.load(new FileInputStream(fitmateSigningPropertiesFile))
}

android {
    namespace "com.growsia.fitmate"
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (
                fitmateSigningPropertiesFile.exists() &&
                fitmateSigningProperties['storeFile'] &&
                fitmateSigningProperties['storePassword'] &&
                fitmateSigningProperties['keyAlias'] &&
                fitmateSigningProperties['keyPassword']
            ) {
                storeFile file(fitmateSigningProperties['storeFile'])
                storePassword fitmateSigningProperties['storePassword']
                keyAlias fitmateSigningProperties['keyAlias']
                keyPassword fitmateSigningProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.growsia.fitmate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "TIKTOK_APP_ID", "\"${escapeBuildConfigValue(tiktokAppId)}\""
        buildConfigField "String", "TIKTOK_TT_APP_ID", "\"${escapeBuildConfigValue(tiktokTtAppId)}\""
        buildConfigField "String", "TIKTOK_ACCESS_TOKEN", "\"${escapeBuildConfigValue(tiktokAccessToken)}\""
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // TikTok App Events SDK (TikTok Business Android SDK)
    implementation 'com.github.tiktok:tiktok-business-android-sdk:1.5.0'
    // TikTok lifecycle + install attribution requirements
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}