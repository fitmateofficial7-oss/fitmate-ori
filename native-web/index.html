<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <title>FitMate</title>

  <style>
    :root {
      --green: #20d34a;
      --green-deep: #12b83c;
      --text-soft: rgba(255,255,255,.75);
      --safe-top: max(20px, env(safe-area-inset-top));
      --safe-bottom: max(20px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 72%;
      object-fit: cover;
      object-position: 49% 19%;
      z-index: -4;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(180deg,
          rgba(0,0,0,.16) 0%,
          rgba(0,0,0,.03) 34%,
          rgba(0,0,0,.30) 57%,
          rgba(0,0,0,.88) 77%,
          #000 92%,
          #000 100%);
    }

    .side-shade {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(90deg, rgba(0,0,0,.42), transparent 58%);
      pointer-events: none;
    }

    .content {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        var(--safe-top)
        18px
        var(--safe-bottom);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: max-content;
      margin-top: 0;
      text-shadow: 0 3px 15px rgba(0,0,0,.75);
    }

    .dumbbell {
      width: 39px;
      height: 24px;
      margin-left: 28px;
      display: block;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.55));
    }

    .brand-name {
      font-size: clamp(36px, 10vw, 46px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -2.2px;
      white-space: nowrap;
    }

    .green { color: var(--green); }

    .bottom {
      margin-top: auto;
      padding-top: 48vh;
    }

    h1 {
      margin: 0;
      max-width: 330px;
      font-size: clamp(35px, 9.7vw, 45px);
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -2px;
      text-shadow: 0 3px 18px rgba(0,0,0,.8);
    }

    .desc {
      margin: 18px 0 0;
      max-width: 330px;
      color: var(--text-soft);
      font-size: clamp(14px, 4vw, 16px);
      line-height: 1.45;
      font-weight: 450;
      text-shadow: 0 2px 10px rgba(0,0,0,.85);
    }

    .actions {
      margin-top: 26px;
    }

    button {
      appearance: none;
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      min-height: 58px;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--green), #25c94d);
      color: #fff;
      font-size: 17px;
      font-weight: 850;
      box-shadow: 0 14px 34px rgba(22, 201, 72, .24);
      transition: transform .13s ease, opacity .13s ease;
    }

    .primary:active { transform: scale(.985); }

    .login {
      margin-top: 20px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,.70);
      font-weight: 550;
    }

    .login button {
      padding: 5px;
      background: transparent;
      color: var(--green);
      font-weight: 800;
    }

    .status {
      display: none;
      margin: 13px auto 0;
      width: max-content;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(0,0,0,.62);
      color: rgba(255,255,255,.80);
      font-size: 12px;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .status.show { display: block; }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);
    }

    .loading.show { display: grid; }

    .loader-card {
      width: min(82vw, 290px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: #0b0d0c;
      padding: 24px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 14px;
      border: 3px solid rgba(255,255,255,.16);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-height: 700px) {
      .bottom { padding-top: 38vh; }
      .desc { margin-top: 12px; }
      .actions { margin-top: 18px; }
      .primary { min-height: 54px; }
      .login { margin-top: 13px; }
    }

    @media (min-width: 600px) {
      .content {
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
      }

      .screen::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -10;
        background: #000;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <img
      class="hero"
      src="./assets/fitmate-mobile-welcome.jpg"
      alt=""
      aria-hidden="true"
    />
    <div class="shade"></div>
    <div class="side-shade"></div>

    <section class="content">
      <div class="brand" aria-label="FitMate">
        <svg class="dumbbell" viewBox="0 0 64 36" aria-hidden="true">
          <rect x="28" y="15" width="8" height="6" rx="2" fill="#20d34a"/>
          <rect x="12" y="8" width="7" height="20" rx="3" fill="#20d34a"/>
          <rect x="6" y="12" width="5" height="12" rx="2.5" fill="#20d34a"/>
          <rect x="45" y="8" width="7" height="20" rx="3" fill="#20d34a"/>
          <rect x="53" y="12" width="5" height="12" rx="2.5" fill="#20d34a"/>
          <rect x="19" y="16" width="9" height="4" rx="2" fill="#20d34a"/>
          <rect x="36" y="16" width="9" height="4" rx="2" fill="#20d34a"/>
        </svg>

        <div class="brand-name">
          <span class="green">Fit</span><span>Mate</span>
        </div>
      </div>

      <div class="bottom">
        <h1>
          Your Fitness<br />
          Your <span class="green">Mate</span>
        </h1>

        <p class="desc">
          Mulai perjalanan fitnessmu bersama FitMate.
          Latihan, nutrisi, jogging, Coach, dan progres
          semua dalam satu aplikasi.
        </p>

        <div class="actions">
          <button id="startButton" class="primary" type="button">
            Mulai Sekarang
          </button>

          <div class="login">
            Sudah punya akun?
            <button id="loginButton" type="button">Masuk</button>
          </div>

          <div id="status" class="status" role="status"></div>
        </div>
      </div>
    </section>

    <div id="loading" class="loading" aria-hidden="true">
      <div class="loader-card">
        <div class="spinner"></div>
        <strong>Membuka FitMate…</strong>
      </div>
    </div>
  </main>

  <script src="./runtime-config.js"></script>
  <script>
    (() => {
      const config = window.FITMATE_NATIVE_CONFIG || {};
      const startButton = document.getElementById("startButton");
      const loginButton = document.getElementById("loginButton");
      const status = document.getElementById("status");
      const loading = document.getElementById("loading");

      function showStatus(message) {
        status.textContent = message;
        status.classList.add("show");
      }

      function navigate(target) {
        if (!navigator.onLine) {
          showStatus("Tidak ada koneksi internet. Sambungkan internet lalu coba lagi.");
          return;
        }

        if (!target) {
          showStatus("Alamat FitMate belum tersedia. Build ulang aplikasi.");
          return;
        }

        loading.classList.add("show");
        loading.setAttribute("aria-hidden", "false");

        window.setTimeout(() => {
          window.location.assign(target);
        }, 160);
      }

      startButton.addEventListener("click", () => navigate(config.registerUrl));
      loginButton.addEventListener("click", () => navigate(config.loginUrl));

      window.addEventListener("online", () => status.classList.remove("show"));
      window.addEventListener("offline", () => {
        showStatus("Koneksi internet terputus.");
      });
    })();
  </script>
</body>
</html>
