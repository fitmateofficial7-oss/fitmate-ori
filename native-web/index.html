<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>FitMate AI</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ecfdf5;color:#0f172a;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
      main{max-width:580px;background:white;border:1px solid #a7f3d0;border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(15,118,110,.14)}
      h1{margin:0 0 12px} code{background:#f1f5f9;padding:3px 7px;border-radius:8px}
    </style>
  </head>
  <body>
    <main>
      <h1>FitMate AI Native Shell</h1>
      <p>Set <code>CAPACITOR_SERVER_URL</code> to the HTTPS address of the deployed FitMate website, then run <code>npm run native:sync</code>.</p>
    </main>
  </body>
</html>
